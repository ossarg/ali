services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: libra
      POSTGRES_PASSWORD: libra
      POSTGRES_DB: libra_legal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libra -d libra_legal"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://libra:libra@postgres:5432/libra_legal
      - REDIS_URL=redis://redis:6379
      - ATTACHMENTS_DIR=/data/attachments   # always overrides .env — never use container-local path
    volumes:
      - /home/legales/ali/data/attachments:/data/attachments
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
