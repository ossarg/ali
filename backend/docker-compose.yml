services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: libra
      POSTGRES_PASSWORD: libra
      POSTGRES_DB: libra_legal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libra -d libra_legal"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://libra:libra@postgres:5432/libra_legal
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
