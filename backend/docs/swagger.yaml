basePath: /
definitions:
  dto.BatchResolveResponse:
    properties:
      errors:
        type: integer
      message:
        type: string
      resolved:
        type: integer
    type: object
  dto.CaseEventMetrics:
    properties:
      approved:
        type: integer
      last_event_at:
        type: string
      pending:
        type: integer
      processed:
        type: integer
      total:
        type: integer
    type: object
  dto.CaseEventResponse:
    properties:
      approved:
        type: boolean
      case_id:
        type: string
      confidence:
        type: number
      corrected_claim_number:
        type: string
      correction_comment:
        type: string
      created_at:
        type: string
      id:
        type: string
      mail_id:
        type: string
      mail_provider:
        type: string
      mail_type:
        type: string
      original_mail_type:
        type: string
      processed:
        type: boolean
      raw_caratula:
        type: string
      raw_case_number:
        type: string
      raw_claim_number:
        type: string
      raw_policy:
        type: string
      reasoning:
        type: string
      received_at:
        type: string
      resolution_error:
        type: string
      resolution_status:
        type: string
      resolved_claim_id:
        type: string
      review_comment:
        type: string
      reviewed_at:
        type: string
      reviewed_by:
        type: string
      subject:
        type: string
    type: object
  dto.CaseResponse:
    properties:
      action_type:
        type: string
      assigned_user:
        $ref: '#/definitions/dto.UserSummary'
      case_number:
        type: string
      case_type:
        type: string
      claim_number:
        type: string
      court:
        type: string
      created_at:
        type: string
      defense_firm:
        $ref: '#/definitions/dto.FirmSummary'
      estimated_amount:
        type: number
      id:
        type: string
      incident_date:
        type: string
      opened_at:
        type: string
      pipeline_stage:
        type: string
      plaintiff_firm:
        $ref: '#/definitions/dto.FirmSummary'
      policy:
        type: string
      status:
        type: string
      title:
        type: string
      tribunal:
        type: string
      updated_at:
        type: string
    type: object
  dto.ClaimLookupResponse:
    properties:
      claim:
        $ref: '#/definitions/sise.ClaimResult'
      policy:
        $ref: '#/definitions/sise.PolicySummary'
      producer:
        $ref: '#/definitions/sise.Producer'
    type: object
  dto.ClaimMetrics:
    properties:
      lawsuit:
        description: JUICIO (sise_status_id=3)
        type: integer
      mediation:
        description: MEDIACION (sise_status_id=5)
        type: integer
      open:
        description: ABIERTO (sise_status_id=4)
        type: integer
      total:
        type: integer
    type: object
  dto.ClaimPaymentResponse:
    properties:
      amount:
        type: number
      id:
        type: string
      payment_date:
        type: string
    type: object
  dto.ClaimResponse:
    properties:
      cause:
        type: string
      claim_number:
        type: integer
      commercial_product:
        type: string
      commercial_product_code:
        type: integer
      contratante:
        type: string
      coverage:
        type: string
      created_at:
        type: string
      current_status:
        type: string
      doc_number:
        type: string
      doc_type:
        type: string
      id:
        type: string
      incident_date:
        type: string
      insured_amount:
        type: number
      notice_date:
        type: string
      policy_endorsement:
        type: integer
      policy_number:
        type: integer
      policy_type:
        type: string
      policy_valid_from:
        type: string
      policy_valid_to:
        type: string
      producer_code:
        type: integer
      producer_group_code:
        type: integer
      producer_name:
        type: string
      producer_status:
        type: string
      producer_type:
        type: string
      producer_type_code:
        type: integer
      ramo_code:
        type: integer
      registration_date:
        type: string
      sise_claim_id:
        type: integer
      sise_id_pv:
        type: integer
      stages:
        items:
          $ref: '#/definitions/dto.ClaimStageResponse'
        type: array
      updated_at:
        type: string
    type: object
  dto.ClaimStageResponse:
    properties:
      id:
        type: string
      payments:
        items:
          $ref: '#/definitions/dto.ClaimPaymentResponse'
        type: array
      stage_number:
        type: integer
      status:
        type: string
    type: object
  dto.CreateCaseEventRequest:
    properties:
      confidence:
        maximum: 1
        minimum: 0
        type: number
      mail_id:
        type: string
      mail_provider:
        type: string
      mail_type:
        maximum: 7
        minimum: 1
        type: integer
      raw_caratula:
        type: string
      raw_case_number:
        type: string
      raw_claim_number:
        description: Raw identifiers extracted from the mail (unnormalized)
        type: string
      raw_policy:
        type: string
      reasoning:
        type: string
      received_at:
        type: string
      subject:
        type: string
    required:
    - confidence
    - mail_id
    - mail_type
    - received_at
    type: object
  dto.FirmSummary:
    properties:
      id:
        type: string
      name:
        type: string
      type:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/dto.UserInfo'
    type: object
  dto.RetryResolutionRequest:
    properties:
      corrected_claim_number:
        type: string
      correction_comment:
        type: string
    required:
    - corrected_claim_number
    type: object
  dto.ReviewCaseEventRequest:
    properties:
      mail_type:
        description: if nil, approves Rachel's classification as-is
        type: integer
      raw_caratula:
        description: carátula
        type: string
      raw_case_number:
        description: nro. expediente
        type: string
      raw_claim_number:
        description: Corrected identifiers (optional — reviewer can fix what Rachel
          missed)
        type: string
      raw_policy:
        description: nro. póliza
        type: string
      review_comment:
        description: required when changing mail_type
        type: string
    type: object
  dto.UserInfo:
    properties:
      capabilities:
        items:
          type: string
        type: array
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      role:
        type: string
    type: object
  dto.UserSummary:
    properties:
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
    type: object
  sise.Claim:
    properties:
      causa:
        type: string
      cobertura:
        type: string
      codigo_ramo:
        type: number
      contratante_pagador:
        type: string
      diagnostico:
        type: string
      estado:
        type: string
      fecha_aviso:
        type: string
      fecha_incurrido:
        type: string
      fecha_pago:
        type: string
      fecha_resgistro:
        description: typo is SISE's own
        type: string
      id_pv:
        type: integer
      id_stro:
        type: integer
      importe_estimado:
        type: number
      importe_pago:
        type: number
      nro_endoso:
        type: number
      nro_poliza:
        type: number
      nro_siniestro:
        type: integer
      nro_subreclamo:
        type: integer
      paciente:
        type: string
      parentesco:
        type: string
      titular:
        type: string
      tomador_doc:
        type: string
      tomador_tipo_doc:
        type: string
    type: object
  sise.ClaimPaymentRow:
    properties:
      amount:
        format: float64
        type: number
      paymentDate:
        type: string
    type: object
  sise.ClaimResult:
    properties:
      header:
        allOf:
        - $ref: '#/definitions/sise.Claim'
        description: shared fields (cause, coverage, dates, policyholder, etc.)
      stages:
        description: one per unique nro_subreclamo
        items:
          $ref: '#/definitions/sise.ClaimStage'
        type: array
    type: object
  sise.ClaimStage:
    properties:
      payments:
        items:
          $ref: '#/definitions/sise.ClaimPaymentRow'
        type: array
      stageNumber:
        format: int64
        type: integer
      status:
        type: string
      statusID:
        format: int32
        type: integer
    type: object
  sise.PolicySummary:
    properties:
      Autoadministrada:
        type: number
      Codido_Asegurado:
        description: typo is SISE's own
        type: number
      Codigo_Productor:
        type: number
      Codigo_Ramo:
        type: number
      Codigo_Sucursal:
        type: number
      Contratante:
        type: string
      Estado:
        type: string
      Fecha_Emision:
        type: string
      Id_pv:
        type: number
      Moneda:
        type: string
      Nombre_o_Razon_Social_Productor:
        type: string
      Numero_Documento:
        type: string
      Numero_Endoso:
        type: number
      Numero_Poliza:
        type: number
      Premio:
        type: number
      Prima:
        type: number
      Producto_comercial:
        type: string
      Ramo:
        type: string
      Sucursal:
        type: string
      Suma_Asegurada:
        type: number
      Tipo_Documento:
        type: string
      Tipo_de_Poliza:
        type: string
      Vigencia_Desde:
        type: string
      Vigencia_Hasta:
        type: string
      cant_items:
        type: number
      cantidad_siniestros:
        type: number
      cod_producto_com:
        type: number
      conducto:
        type: string
      tarjeta_cbu:
        type: string
      telefono_tomador:
        type: string
      tipo_conducto:
        type: string
    type: object
  sise.Producer:
    properties:
      cod_agente:
        type: number
      cod_baja:
        type: number
      cod_estado:
        type: string
      cod_grupo:
        type: number
      cod_tipo_agente:
        type: number
      fec_baja:
        type: string
      nombre:
        type: string
      tipo_agente:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: Libra Seguros Tech
  description: Backend service for Libra Legal AI — legal case management platform
  title: Libra Legal API
  version: "1.0"
paths:
  /api/v1/activity/events/{id}/resolve:
    post:
      consumes:
      - application/json
      description: Human corrects the claim number extracted by Rachel and retries
        SISE lookup.
      parameters:
      - description: Case event UUID
        in: path
        name: id
        required: true
        type: string
      - description: Correction payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RetryResolutionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CaseEventResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Retry claim resolution with corrected nro_stro
      tags:
      - claims
  /api/v1/agents/case-events:
    post:
      consumes:
      - application/json
      description: |-
        Called by Rachel after classifying an email. Requires X-Agent-Key header.
        Returns case events where SISE claim lookup failed.
      parameters:
      - description: Case event payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCaseEventRequest'
      produces:
      - application/json
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.CaseEventResponse'
            type: array
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CaseEventResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List unresolved case events
      tags:
      - cases
      - claims
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns a JWT token
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      description: Invalidates the session (client-side). JWT blacklist pending.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - auth
  /api/v1/case-events/{id}/review:
    patch:
      consumes:
      - application/json
      description: A human reviewer approves Rachel's classification or corrects it
        with a comment.
      parameters:
      - description: Case event UUID
        in: path
        name: id
        required: true
        type: string
      - description: Review payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ReviewCaseEventRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CaseEventResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Approve or correct a case event classification
      tags:
      - cases
  /api/v1/case-events/approved:
    get:
      description: Returns all case events approved by a human reviewer (activity
        history).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.CaseEventResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List approved case events
      tags:
      - cases
  /api/v1/case-events/metrics:
    get:
      description: 'Returns aggregated stats: total, approved, pending, processed,
        and last event timestamp.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CaseEventMetrics'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get case event metrics
      tags:
      - cases
  /api/v1/case-events/pending:
    get:
      description: Returns all case events not yet approved by a human reviewer.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.CaseEventResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List pending case events
      tags:
      - cases
  /api/v1/cases:
    get:
      description: Returns a list of legal cases. Supports optional filtering by status,
        pipeline_stage, and case_type.
      parameters:
      - description: Case status (1=open, 2=closed, 3=suspended)
        in: query
        name: status
        type: integer
      - description: Pipeline stage (ingesta, extraccion, triage, asignado, borrador,
          completado)
        in: query
        name: pipeline_stage
        type: string
      - description: Case type (1=lawsuit, 2=mediation, 3=third_party)
        in: query
        name: case_type
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.CaseResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List cases
      tags:
      - cases
  /api/v1/cases/{id}:
    get:
      description: Returns a single legal case with associated firm and user data.
      parameters:
      - description: Case UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CaseResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get case by ID
      tags:
      - cases
  /api/v1/claims:
    get:
      description: Returns all claims persisted in our DB, ordered by creation date
        desc.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.ClaimResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List all claims
      tags:
      - claims
    post:
      consumes:
      - application/json
      description: Fetches claim from SISE and persists it in our DB. Idempotent by
        sise_claim_id.
      parameters:
      - description: Claim number
        in: body
        name: body
        required: true
        schema:
          properties:
            nro_stro:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ClaimResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a claim from SISE data
      tags:
      - claims
  /api/v1/claims/{id}:
    get:
      description: Returns a single claim from our DB by UUID.
      parameters:
      - description: Claim UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ClaimResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get a claim by ID
      tags:
      - claims
  /api/v1/claims/batch-resolve:
    post:
      description: Finds all approved events with raw_claim_number not yet resolved
        and queries SISE.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BatchResolveResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Batch resolve pending claim events
      tags:
      - claims
  /api/v1/claims/lookup:
    get:
      description: Fetches claim + policy + producer from SISE by claim number. Does
        not persist.
      parameters:
      - description: SISE claim number
        in: query
        name: nro_stro
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ClaimLookupResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Look up a claim in SISE
      tags:
      - claims
  /api/v1/claims/metrics:
    get:
      description: Returns aggregated claim counts by status.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ClaimMetrics'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get claim metrics
      tags:
      - claims
  /api/v1/claims/unresolved:
    get:
      consumes:
      - application/json
      description: |-
        Called by Rachel after classifying an email. Requires X-Agent-Key header.
        Returns case events where SISE claim lookup failed.
      parameters:
      - description: Case event payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCaseEventRequest'
      produces:
      - application/json
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.CaseEventResponse'
            type: array
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CaseEventResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List unresolved case events
      tags:
      - cases
      - claims
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and the JWT token
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
