<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800"
     font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000015"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7"
            refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="800" fill="#fafaf9" rx="12"/>

  <!-- Title -->
  <text x="550" y="36" text-anchor="middle" font-size="20"
        font-weight="700" fill="#1e293b">Libra Legal AI — Scope of Work</text>
  <text x="550" y="56" text-anchor="middle" font-size="12"
        fill="#94a3b8">Sistema de agentes de IA para gestión integral de litigios</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- GRID: 3-col at x=80/400/720, each w=300   -->
  <!-- Full span: x=80, w=940                      -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- ── PROBLEMA ── -->
  <text x="80" y="82" font-size="12" font-weight="700"
        fill="#475569" letter-spacing="1">PROBLEMA</text>

  <rect x="80" y="92" width="300" height="54" rx="8" fill="#1e293b" filter="url(#shadow)"/>
  <text x="230" y="114" text-anchor="middle" font-size="13"
        font-weight="600" fill="#f8fafc">Procesos manuales</text>
  <text x="230" y="132" text-anchor="middle" font-size="10"
        fill="#94a3b8">Excel · Categorización a criterio · Sin datos</text>

  <rect x="400" y="92" width="300" height="54" rx="8" fill="#1e293b" filter="url(#shadow)"/>
  <text x="550" y="114" text-anchor="middle" font-size="13"
        font-weight="600" fill="#f8fafc">Dependencia externa</text>
  <text x="550" y="132" text-anchor="middle" font-size="10"
        fill="#94a3b8">Litigios gestionados por estudios jurídicos</text>

  <rect x="720" y="92" width="300" height="54" rx="8" fill="#1e293b" filter="url(#shadow)"/>
  <text x="870" y="114" text-anchor="middle" font-size="13"
        font-weight="600" fill="#f8fafc">Sin trazabilidad</text>
  <text x="870" y="132" text-anchor="middle" font-size="10"
        fill="#94a3b8">No existe base de datos de litigios</text>

  <!-- Arrow Problema → Solución -->
  <line x1="550" y1="146" x2="550" y2="170" stroke="#64748b"
        stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── SOLUCIÓN (hero) ── -->
  <text x="80" y="182" font-size="12" font-weight="700"
        fill="#475569" letter-spacing="1">SOLUCIÓN</text>

  <rect x="80" y="192" width="940" height="56" rx="10" fill="#0f766e" filter="url(#shadow)"/>
  <text x="550" y="216" text-anchor="middle" font-size="17"
        font-weight="700" fill="#f0fdfa">Co-worker Legal IA</text>
  <text x="550" y="236" text-anchor="middle" font-size="11"
        fill="#99f6e4">Agentes especializados · Modular · Agnóstico en modelo · Auditable</text>

  <!-- Arrow Solución → Funciones -->
  <line x1="550" y1="248" x2="550" y2="272" stroke="#64748b"
        stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── FUNCIONES (3×3 numbered grid) ── -->
  <text x="80" y="284" font-size="12" font-weight="700"
        fill="#475569" letter-spacing="1">FUNCIONES</text>

  <!-- Row 1 — L1 -->
  <rect x="80" y="294" width="300" height="54" rx="8" fill="#1e293b" filter="url(#shadow)"/>
  <text x="230" y="316" text-anchor="middle" font-size="12"
        font-weight="600" fill="#f8fafc">1. Ingesta y revisión formal</text>
  <text x="230" y="334" text-anchor="middle" font-size="10"
        fill="#94a3b8">Recepción PDF · Validación procesales</text>

  <rect x="400" y="294" width="300" height="54" rx="8" fill="#1e293b" filter="url(#shadow)"/>
  <text x="550" y="316" text-anchor="middle" font-size="12"
        font-weight="600" fill="#f8fafc">2. Extracción de datos</text>
  <text x="550" y="334" text-anchor="middle" font-size="10"
        fill="#94a3b8">Demandante · Monto · Tribunal · Póliza</text>

  <rect x="720" y="294" width="300" height="54" rx="8" fill="#1e293b" filter="url(#shadow)"/>
  <text x="870" y="316" text-anchor="middle" font-size="12"
        font-weight="600" fill="#f8fafc">3. Tabular view</text>
  <text x="870" y="334" text-anchor="middle" font-size="10"
        fill="#94a3b8">Base de datos estructurada de litigios</text>

  <!-- Row 2 — L2 -->
  <rect x="80" y="362" width="300" height="54" rx="8" fill="#1e3a5f" filter="url(#shadow)"/>
  <text x="230" y="384" text-anchor="middle" font-size="12"
        font-weight="600" fill="#f8fafc">4. Triage</text>
  <text x="230" y="402" text-anchor="middle" font-size="10"
        fill="#cbd5e1">Plazo · Monto · Complejidad · Prioridad</text>

  <rect x="400" y="362" width="300" height="54" rx="8" fill="#1e3a5f" filter="url(#shadow)"/>
  <text x="550" y="384" text-anchor="middle" font-size="12"
        font-weight="600" fill="#f8fafc">5. Generación de fichero</text>
  <text x="550" y="402" text-anchor="middle" font-size="10"
        fill="#cbd5e1">Demanda + Póliza + Metadata en carpeta</text>

  <rect x="720" y="362" width="300" height="54" rx="8" fill="#1e3a5f" filter="url(#shadow)"/>
  <text x="870" y="384" text-anchor="middle" font-size="12"
        font-weight="600" fill="#f8fafc">6. Borrador de contestación</text>
  <text x="870" y="402" text-anchor="middle" font-size="10"
        fill="#cbd5e1">Template: partes estáticas + dinámicas</text>

  <!-- Row 3 — L3 -->
  <rect x="80" y="430" width="300" height="54" rx="8" fill="#334155" filter="url(#shadow)"/>
  <text x="230" y="452" text-anchor="middle" font-size="12"
        font-weight="600" fill="#f8fafc">7. Asignación a abogados</text>
  <text x="230" y="470" text-anchor="middle" font-size="10"
        fill="#cbd5e1">Expertise · Seniority · Carga de trabajo</text>

  <rect x="400" y="430" width="300" height="54" rx="8" fill="#334155" filter="url(#shadow)"/>
  <text x="550" y="452" text-anchor="middle" font-size="12"
        font-weight="600" fill="#f8fafc">8. Seguimiento de casos</text>
  <text x="550" y="470" text-anchor="middle" font-size="10"
        fill="#cbd5e1">SAIJ · Sistemas judiciales públicos</text>

  <rect x="720" y="430" width="300" height="54" rx="8" fill="#334155" filter="url(#shadow)"/>
  <text x="870" y="452" text-anchor="middle" font-size="12"
        font-weight="600" fill="#f8fafc">9. Analytics y reporting</text>
  <text x="870" y="470" text-anchor="middle" font-size="10"
        fill="#cbd5e1">Dashboards · Métricas · Tendencias</text>

  <!-- Arrow Funciones → Fases -->
  <line x1="550" y1="484" x2="550" y2="508" stroke="#64748b"
        stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── FASES ── -->
  <text x="80" y="520" font-size="12" font-weight="700"
        fill="#475569" letter-spacing="1">FASES</text>

  <!-- Phase 1 — PoC -->
  <rect x="80" y="530" width="295" height="85" rx="10" fill="#1e293b" filter="url(#shadow)"/>
  <text x="227" y="555" text-anchor="middle" font-size="14"
        font-weight="700" fill="#f8fafc">Fase 1 — PoC</text>
  <text x="227" y="573" text-anchor="middle" font-size="10"
        fill="#94a3b8">Ingesta · Extracción · Tabular · Triage</text>
  <line x1="110" y1="583" x2="345" y2="583" stroke="#475569"
        stroke-width="0.5" opacity="0.3"/>
  <text x="227" y="600" text-anchor="middle" font-size="11"
        font-weight="600" fill="#0f766e">1–2 demandas reales</text>

  <!-- Arrow PoC → MVP -->
  <line x1="375" y1="572" x2="400" y2="572" stroke="#64748b"
        stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Phase 2 — MVP -->
  <rect x="400" y="530" width="295" height="85" rx="10" fill="#1e3a5f" filter="url(#shadow)"/>
  <text x="547" y="555" text-anchor="middle" font-size="14"
        font-weight="700" fill="#f8fafc">Fase 2 — MVP</text>
  <text x="547" y="573" text-anchor="middle" font-size="10"
        fill="#cbd5e1">Fichero · Borrador · Asignación básica</text>
  <line x1="430" y1="583" x2="665" y2="583" stroke="#475569"
        stroke-width="0.5" opacity="0.3"/>
  <text x="547" y="600" text-anchor="middle" font-size="11"
        font-weight="600" fill="#0f766e">Sistema funcional interno</text>

  <!-- Arrow MVP → Producción -->
  <line x1="695" y1="572" x2="720" y2="572" stroke="#64748b"
        stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Phase 3 — Producción -->
  <rect x="720" y="530" width="300" height="85" rx="10" fill="#334155" filter="url(#shadow)"/>
  <text x="870" y="555" text-anchor="middle" font-size="14"
        font-weight="700" fill="#f8fafc">Fase 3 — Producción</text>
  <text x="870" y="573" text-anchor="middle" font-size="10"
        fill="#cbd5e1">Seguimiento · Analytics · Mission Control</text>
  <line x1="750" y1="583" x2="990" y2="583" stroke="#475569"
        stroke-width="0.5" opacity="0.3"/>
  <text x="870" y="600" text-anchor="middle" font-size="11"
        font-weight="600" fill="#0f766e">100–200 demandas/mes</text>

  <!-- ── OBJETIVOS ── -->
  <text x="80" y="646" font-size="12" font-weight="700"
        fill="#475569" letter-spacing="1">OBJETIVOS</text>

  <rect x="80" y="656" width="145" height="44" rx="8"
        fill="#fafaf9" stroke="#0f766e" stroke-width="1.5"/>
  <text x="152" y="674" text-anchor="middle" font-size="11"
        font-weight="600" fill="#0f766e">Reducir costos</text>
  <text x="152" y="690" text-anchor="middle" font-size="9"
        fill="#64748b">Menos estudios externos</text>

  <rect x="239" y="656" width="145" height="44" rx="8"
        fill="#fafaf9" stroke="#0f766e" stroke-width="1.5"/>
  <text x="311" y="674" text-anchor="middle" font-size="11"
        font-weight="600" fill="#0f766e">Productividad</text>
  <text x="311" y="690" text-anchor="middle" font-size="9"
        fill="#64748b">Automatizar lo repetitivo</text>

  <rect x="398" y="656" width="145" height="44" rx="8"
        fill="#fafaf9" stroke="#0f766e" stroke-width="1.5"/>
  <text x="470" y="674" text-anchor="middle" font-size="11"
        font-weight="600" fill="#0f766e">Calidad</text>
  <text x="470" y="690" text-anchor="middle" font-size="9"
        fill="#64748b">Estandarizar respuestas</text>

  <rect x="557" y="656" width="145" height="44" rx="8"
        fill="#fafaf9" stroke="#0f766e" stroke-width="1.5"/>
  <text x="629" y="674" text-anchor="middle" font-size="11"
        font-weight="600" fill="#0f766e">Tiempos</text>
  <text x="629" y="690" text-anchor="middle" font-size="9"
        fill="#64748b">Recepción → contestación</text>

  <rect x="716" y="656" width="145" height="44" rx="8"
        fill="#fafaf9" stroke="#0f766e" stroke-width="1.5"/>
  <text x="788" y="674" text-anchor="middle" font-size="11"
        font-weight="600" fill="#0f766e">Trazabilidad</text>
  <text x="788" y="690" text-anchor="middle" font-size="9"
        fill="#64748b">Base de datos unificada</text>

  <rect x="875" y="656" width="145" height="44" rx="8"
        fill="#fafaf9" stroke="#0f766e" stroke-width="1.5"/>
  <text x="947" y="674" text-anchor="middle" font-size="11"
        font-weight="600" fill="#0f766e">Escalabilidad</text>
  <text x="947" y="690" text-anchor="middle" font-size="9"
        fill="#64748b">Volumen sin más headcount</text>

  <!-- ── ABIERTOS ── -->
  <text x="80" y="730" font-size="12" font-weight="700"
        fill="#475569" letter-spacing="1">ABIERTOS</text>

  <rect x="80" y="740" width="940" height="36" rx="8"
        fill="#fffbeb" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="550" y="757" text-anchor="middle" font-size="10"
        font-weight="600" fill="#78350f">Muestras de demandas · Templates de contestación · Sistemas internos · Modelo LLM · Stack técnico · Regulación SSN</text>
  <text x="550" y="770" text-anchor="middle" font-size="9"
        fill="#92400e">Estos puntos se resuelven progresivamente antes de cada fase</text>

  <!-- Footer -->
  <text x="550" y="795" text-anchor="middle" font-size="10"
        fill="#cbd5e1">Libra Legal AI — Scope of Work — Feb 2026</text>
</svg>
